# Day-type rules. Every threshold lives here; digest/regime.py only says what is compared.
#
# Labels: trend_up, trend_down, balance, gap_and_go, gap_and_fill, undetermined.
#   gap_and_go    |gap| > gap_pct_min and, at classify_time_et, spot is beyond the opening range in the gap direction
#   gap_and_fill  |gap| > gap_pct_min and, at classify_time_et, spot is back inside the prior value area
#   trend_*       opens outside the prior value area, fewer than (trend_max_vwap_crosses + 1) VWAP crosses by
#                 vwap_cutoff_et, and one-sided (closes on one side of VWAP at least one_sided_min_frac of the time,
#                 on the same side as the open relative to value)
#   balance       opens inside the prior value area, VWAP crossed both ways (>= balance_min_vwap_crosses by the
#                 cutoff), developing POC between profile_lower and profile_upper of the day's range
#   undetermined  before classify_time_et, when no rule set is fully met, or when the gap rule and the
#                 structure rule point in opposite directions
# Gap rules are checked first; a gap label and a same-direction structure label are compatible.

version: 2

classify:
  gap_pct_min: 0.5
  classify_time_et: "10:30"
  vwap_cutoff_et: "11:00"
  trend_max_vwap_crosses: 1
  one_sided_min_frac: 0.7
  balance_min_vwap_crosses: 2
  profile_lower: 0.33
  profile_upper: 0.67
  elongated_va_frac: 0.8
  vwap_cross_min_pts: 0.0
  acceptance_closes: 2

levels:
  confluence_tolerance_pts: 5
  round_step_pts: 50

premium:
  crush_done_pct: -20
  # VIX1D percentile rank against its last 20 closes.
  vix1d_low_below: 25
  vix1d_high_from: 75
  vix1d_extreme_from: 95
  volume_returning_ratio: 1.2
  # ATM extrinsic remaining by time of day (sqrt-of-time model), shown as the theta reference.
  theta_table_et: ["10:30", "11:30", "12:30", "13:30", "14:30", "15:30"]

# Calendar event -> premium_relevance.
premium_relevance:
  high: [FOMC_DECISION, FOMC_PRESS_CONFERENCE, CPI, NFP, PCE, MEGACAP_EARNINGS, FF_HIGH]
  medium: [PPI, RETAIL_SALES, AUCTION_10Y_20Y_30Y, FED_SPEAKER, FED_TESTIMONY, FOMC_MINUTES, FF_MEDIUM]
  # anything else -> low (GDP, other auctions, other large-cap earnings, ...)

intraday:
  retest_tolerance_atr_frac: 0.05
