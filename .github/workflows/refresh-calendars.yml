name: refresh-calendars
# Weekly refresh of calendars/*.json from federalreserve.gov, bea.gov, FRED (BLS/Census dates),
# treasurydirect.gov, and the large-cap earnings list. Refreshes merge; nothing is deleted.
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (03:00-04:00 PT), before premarket
  workflow_dispatch:

concurrency:
  group: digest-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.14", cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock
      - run: |
          python -m digest refresh-calendars --year "$(date -u +%Y)"
          # Pick up next year's FOMC/econ dates once they are published (Q4).
          if [ "$(date -u +%m)" -ge 10 ]; then python -m digest refresh-calendars --year "$(( $(date -u +%Y) + 1 ))" || true; fi
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if changed
        run: |
          git add calendars
          if git diff --cached --quiet; then echo "calendars unchanged"; exit 0; fi
          git config user.name "spx-digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh calendars"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
