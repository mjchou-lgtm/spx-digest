name: deploy
# Builds site/ from posts/ and deploys to GitHub Pages. Called after each post; also runs
# on pushes that change the site code (bot pushes made with GITHUB_TOKEN do not trigger it).
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [digest/**, templates/**, static/**, docs/**, regime_rules.yaml, posts/**]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock
      - id: pages
        uses: actions/configure-pages@v5
      - run: python -m digest build
        env:
          DIGEST_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
