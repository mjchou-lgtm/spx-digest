name: straddle
# Records the day's 09:35 ET ATM straddle print (the reference for the IV-crush check) in
# data/<date>/straddle_0935.json. Cron is UTC with one entry per offset (EDT, EST); the script
# skips unless it is 09:35-10:00 ET on a trading day and nothing has been captured yet.
# Run it by hand with a price to type the print in yourself.
on:
  schedule:
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"
  workflow_dispatch:
    inputs:
      price:
        description: "Straddle price in SPX points, typed in by hand (blank = capture from the free chain now)"
        type: string
        default: ""
      date:
        description: "YYYY-MM-DD for a hand-entered print (blank = today ET)"
        type: string
        default: ""
      scheduled:
        description: "Behave like the cron run: only 09:35-10:00 ET on a trading day, once per day"
        type: boolean
        default: false

concurrency:
  group: digest-writer
  cancel-in-progress: false

jobs:
  straddle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.14", cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock
      - id: run
        name: digest straddle
        env:
          PRICE: ${{ inputs.price }}
          DATE: ${{ inputs.date }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
        run: |
          args=()
          [ "$SCHEDULED" = "true" ] && args+=(--scheduled)
          [ -n "$PRICE" ] && args+=(--set "$PRICE")
          [ -n "$DATE" ] && args+=(--date "$DATE")
          python -m digest straddle "${args[@]}"
      - name: Commit data/
        if: steps.run.outputs.posted == 'true'
        run: |
          git config user.name "spx-digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "09:35 ET straddle print: ${{ steps.run.outputs.post_path }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
