# Reusable: generate one post, commit it, deploy the site. Called by premarket/midsession/afternoon.yml.
name: post (reusable)
on:
  workflow_call:
    inputs:
      post: {type: string, required: true}
      scheduled: {type: boolean, default: true}
      date: {type: string, default: ""}
      dry_run: {type: boolean, default: false}
      confirm_empty: {type: boolean, default: false}
    secrets:
      ANTHROPIC_API_KEY: {required: false}
      FRED_API_KEY: {required: false}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      posted: ${{ steps.run.outputs.posted }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.14", cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock
      - id: run
        name: digest run --post ${{ inputs.post }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DIGEST_LOG: INFO
        run: |
          args=(--post "${{ inputs.post }}")
          [ "${{ inputs.scheduled }}" = "true" ] && args+=(--scheduled)
          [ -n "${{ inputs.date }}" ] && args+=(--date "${{ inputs.date }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          [ "${{ inputs.confirm_empty }}" = "true" ] && args+=(--confirm-empty)
          python -m digest run "${args[@]}"
      - name: Upload dry-run output
        if: inputs.dry_run && steps.run.outputs.posted == 'true'
        uses: actions/upload-artifact@v7
        with: {name: "dry-run-${{ inputs.post }}", path: out/}
      - name: Commit posts/ and data/
        if: ${{ !inputs.dry_run && steps.run.outputs.posted == 'true' }}
        run: |
          git config user.name "spx-digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts data
          git commit -m "${{ inputs.post }} ${{ inputs.date || 'post' }}: ${{ steps.run.outputs.post_path }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: generate
    if: ${{ needs.generate.outputs.posted == 'true' && !inputs.dry_run }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
