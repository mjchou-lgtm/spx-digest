name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14", cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
